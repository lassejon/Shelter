services:
  postgres:
    # Custom image: official postgres:18 + postgresql-18-postgis-3 from PGDG. Built locally
    # so we depend on a single trusted upstream (the official postgres image) instead of a
    # third-party PostGIS distro. The image: tag pins what compose builds and lets
    # Testcontainers reuse the cached image in integration tests.
    build:
      context: ./docker/postgres
    image: shelter-postgis:dev
    container_name: shelter-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: shelter
      POSTGRES_PASSWORD: shelter
      POSTGRES_DB: shelter
    ports:
      - "5432:5432"
    volumes:
      - shelter-postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shelter -d shelter"]
      interval: 5s
      timeout: 3s
      retries: 5

  azurite:
    image: mcr.microsoft.com/azure-storage/azurite
    container_name: shelter-azurite
    restart: unless-stopped
    # Bind to 0.0.0.0 so the host (and other containers) can reach the emulator.
    # The default only listens on 127.0.0.1 inside the container, which is unreachable from outside.
    # `--location /data` persists blobs/queues/tables to the mounted volume; without it Azurite
    # writes to its workdir (/opt/azurite) which is wiped on every container recreate.
    command: "azurite --blobHost 0.0.0.0 --queueHost 0.0.0.0 --tableHost 0.0.0.0 --location /data --debug /data/debug.log"
    ports:
      - "10000:10000"  # Blob
      - "10001:10001"  # Queue
      - "10002:10002"  # Table
    volumes:
      - shelter-azurite:/data

volumes:
  shelter-postgres:
  shelter-azurite:
